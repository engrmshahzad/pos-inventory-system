# /etc/nginx/sites-available/pos  — then: ln -s ../sites-available/pos /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name pos.yourdomain.com;
    root /var/www/pos/public;
    index index.php;

    client_max_body_size 10M;          # uploads: images, receipts, Excel imports
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # match your PHP version
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    location ~* \.(css|js|png|jpg|jpeg|webp|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }

    location ~ /\.(?!well-known) { deny all; }
}
# certbot --nginx -d pos.yourdomain.com  adds the HTTPS server block and redirect.
