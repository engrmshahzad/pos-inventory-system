; /etc/supervisor/conf.d/pos-worker.conf  — then: supervisorctl reread && supervisorctl update
[program:pos-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pos/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/pos/storage/logs/worker.log
stopwaitsecs=3600
